<!DOCTYPE html>
<html>
<head>
<title>Margin Analysis Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f4f6f9;
    margin: 0;
}

/* HEADER */
.header {
    background: #1e293b;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

/* MODE SWITCH */
.topbar {
    padding: 10px;
    text-align: center;
    background: white;
}

select, input {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100%;
    font-size: 14px;
}

/* LAYOUT */
.container {
    display: flex;
    gap: 15px;
    padding: 15px;
}

/* CARD */
.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    flex: 1;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.card h3 {
    margin-top: 0;
    font-size: 18px;
}

/* TABLE */
table {
    width: 100%;
}

td {
    padding: 6px;
}

/* BUTTON */
button {
    width: 90%;
    margin: 15px auto;
    display: block;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

/* RESULT */
.result {
    background: white;
    margin: 10px;
    padding: 15px;
    border-radius: 10px;
}

.green { color: #16a34a; font-weight: bold; }
.red { color: #dc2626; font-weight: bold; }

/* MOBILE */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
    }
}

</style>
</head>

<body>

<div class="header">Margin Analysis Pro</div>

<div class="topbar">
Mode:
<select id="modeView" onchange="toggleMode()">
<option value="single">Single</option>
<option value="compare">Comparison</option>
</select>
</div>

<div class="container">

<!-- CUSTOMER A -->
<div class="card" id="boxA">
<h3>Customer A</h3>
<table>

<tr><td>RM</td><td><input id="rmA"></td></tr>
<tr><td>Discount</td><td><input id="discA"></td></tr>
<tr><td>MB %</td><td><input id="mbA"></td></tr>
<tr><td>MB Price</td><td><input id="mbpA"></td></tr>
<tr><td>Filler %</td><td><input id="fpA"></td></tr>
<tr><td>Filler Price</td><td><input id="fppA"></td></tr>

<tr><td>Energy Mode</td>
<td>
<select id="emA">
<option value="direct">₹/kg</option>
<option value="mmbtu">MMBTU</option>
</select>
</td></tr>

<tr><td>MMBTU</td><td><input id="mmbA"></td></tr>
<tr><td>Rate</td><td><input id="rateA"></td></tr>
<tr><td>Elec</td><td><input id="elecA"></td></tr>

<tr><td>Labour</td><td><input id="labA"></td></tr>
<tr><td>Pack</td><td><input id="packA"></td></tr>
<tr><td>Other</td><td><input id="otherA"></td></tr>
<tr><td>Fixed</td><td><input id="fixA"></td></tr>

<tr><td>Selling Price</td><td><input id="spA"></td></tr>
<tr><td>Weight</td><td><input id="wtA"></td></tr>

</table>
</div>

<!-- CUSTOMER B -->
<div class="card" id="boxB">
<h3>Customer B</h3>
<table>

<tr><td>RM</td><td><input id="rmB"></td></tr>
<tr><td>Discount</td><td><input id="discB"></td></tr>
<tr><td>MB %</td><td><input id="mbB"></td></tr>
<tr><td>MB Price</td><td><input id="mbpB"></td></tr>
<tr><td>Filler %</td><td><input id="fpB"></td></tr>
<tr><td>Filler Price</td><td><input id="fppB"></td></tr>

<tr><td>Energy Mode</td>
<td>
<select id="emB">
<option value="direct">₹/kg</option>
<option value="mmbtu">MMBTU</option>
</select>
</td></tr>

<tr><td>MMBTU</td><td><input id="mmbB"></td></tr>
<tr><td>Rate</td><td><input id="rateB"></td></tr>
<tr><td>Elec</td><td><input id="elecB"></td></tr>

<tr><td>Labour</td><td><input id="labB"></td></tr>
<tr><td>Pack</td><td><input id="packB"></td></tr>
<tr><td>Other</td><td><input id="otherB"></td></tr>
<tr><td>Fixed</td><td><input id="fixB"></td></tr>

<tr><td>Selling Price</td><td><input id="spB"></td></tr>
<tr><td>Weight</td><td><input id="wtB"></td></tr>

</table>
</div>

</div>

<button onclick="runCalc()">Calculate</button>

<div id="resultA" class="result"></div>
<div id="resultB" class="result"></div>

<script>

function toggleMode() {
    let mode = modeView.value;
    boxB.style.display = (mode === "compare") ? "block" : "none";
    resultB.style.display = (mode === "compare") ? "block" : "none";
}

function calc(p) {

    let rm = +document.getElementById("rm"+p).value || 0;
    let disc = +document.getElementById("disc"+p).value || 0;
    let mb = +document.getElementById("mb"+p).value || 0;
    let mbp = +document.getElementById("mbp"+p).value || 0;
    let fp = +document.getElementById("fp"+p).value || 0;
    let fpp = +document.getElementById("fpp"+p).value || 0;

    let energy = document.getElementById("em"+p).value === "mmbtu"
        ? (+document.getElementById("mmb"+p).value || 0) * (+document.getElementById("rate"+p).value || 0)
        : (+document.getElementById("elec"+p).value || 0);

    let other = (+document.getElementById("lab"+p).value || 0)
        + (+document.getElementById("pack"+p).value || 0)
        + (+document.getElementById("other"+p).value || 0)
        + (+document.getElementById("fix"+p).value || 0);

    let polymer = 100 - (mb + fp);
    let polymerCost = (rm - disc) * polymer/100;
    let mbCost = mb/100 * mbp;
    let fillerCost = fp/100 * fpp;

    let total = polymerCost + mbCost + fillerCost + energy + other;
    let sp = +document.getElementById("sp"+p).value || 0;
    let margin = sp - total;

    let color = margin >= 0 ? "green" : "red";

    return {
        html: `
        <b>Total Cost:</b> ${total.toFixed(2)}<br>
        <b>Margin:</b> <span class="${color}">${margin.toFixed(2)}</span><br>
        <b>Margin %:</b> ${(sp ? margin/sp*100 : 0).toFixed(2)}%
        `,
        margin
    };
}

function runCalc() {

    let A = calc("A");
    resultA.innerHTML = A.html;

    if (modeView.value === "compare") {
        let B = calc("B");
        resultB.innerHTML = B.html;

        let better = A.margin > B.margin ? "Customer A better" : "Customer B better";
        resultB.innerHTML += "<hr><b>"+better+"</b>";
    }
}

toggleMode();

</script>

</body>
</html>
