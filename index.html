<!DOCTYPE html>
<html>
<head>
<title>Margin Analysis Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: sans-serif; background:#f4f6f9; margin:0; }
.header { background:#1e293b; color:white; padding:15px; text-align:center; font-size:20px; }

.container { display:flex; gap:15px; padding:15px; }
.card { background:white; padding:15px; border-radius:10px; flex:1; box-shadow:0 2px 6px rgba(0,0,0,0.1); }

table { width:100%; }
td { padding:6px; }

input, select {
    width:100%; padding:8px; border-radius:6px; border:1px solid #ccc;
}

button {
    width:90%; margin:15px auto; display:block;
    padding:12px; background:#2563eb; color:white; border:none; border-radius:8px;
}

.result { background:white; margin:10px; padding:15px; border-radius:10px; }

.green { color:green; font-weight:bold; }
.red { color:red; font-weight:bold; }

@media(max-width:768px){
    .container { flex-direction:column; }
}
</style>
</head>

<body>

<div class="header">Margin Analysis Pro</div>

<div class="container">

<div class="card">
<h3>Input</h3>

<table>
<tr><td>RM Price</td><td><input id="rm"></td></tr>
<tr><td>Discount</td><td><input id="disc"></td></tr>

<tr><td>MB %</td><td><input id="mb"></td></tr>
<tr><td>MB Price</td><td><input id="mbp"></td></tr>

<tr><td>Filler %</td><td><input id="fp"></td></tr>
<tr><td>Filler Price</td><td><input id="fpp"></td></tr>

<tr><td>Energy Mode</td>
<td>
<select id="mode">
<option value="direct">₹/kg</option>
<option value="mmbtu">MMBTU</option>
</select>
</td></tr>

<tr><td>MMBTU/kg</td><td><input id="mmb"></td></tr>
<tr><td>Rate</td><td><input id="rate"></td></tr>
<tr><td>Elec ₹/kg</td><td><input id="elec"></td></tr>

<tr><td>Labour</td><td><input id="lab"></td></tr>
<tr><td>Packaging</td><td><input id="pack"></td></tr>
<tr><td>Other</td><td><input id="other"></td></tr>
<tr><td>Wastage</td><td><input id="wast"></td></tr>

<tr><td>Fixed</td><td><input id="fix"></td></tr>

<tr><td>Selling Price</td><td><input id="sp"></td></tr>
</table>

</div>

</div>

<button onclick="calc()">Calculate</button>

<div id="result" class="result"></div>

<script>

function calc(){

let rmv = +document.getElementById("rm").value || 0;
let discv = +document.getElementById("disc").value || 0;

let mbv = +document.getElementById("mb").value || 0;
let mbpv = +document.getElementById("mbp").value || 0;

let fpv = +document.getElementById("fp").value || 0;
let fppv = +document.getElementById("fpp").value || 0;

let wastv = +document.getElementById("wast").value || 0;

let base = rmv - discv;

// composition
let polymer = 100 - (mbv + fpv);

// COST BREAKDOWN
let polymerCost = base * polymer/100;
let mbCost = mbv/100 * mbpv;
let fillerCost = fpv/100 * fppv;

let netRM = polymerCost + mbCost + fillerCost;

// ENERGY
let energy = (document.getElementById("mode").value === "mmbtu")
    ? (+document.getElementById("mmb").value || 0) * (+document.getElementById("rate").value || 0)
    : (+document.getElementById("elec").value || 0);

// VARIABLE COST
let labour = +document.getElementById("lab").value || 0;
let pack = +document.getElementById("pack").value || 0;
let otherC = +document.getElementById("other").value || 0;

let variable = energy + labour + pack + otherC + wastv;

// TOTAL COST
let fixed = +document.getElementById("fix").value || 0;

let totalCost = netRM + variable + fixed;

// MARGIN
let spv = +document.getElementById("sp").value || 0;
let margin = spv - totalCost;
let marginPct = spv ? (margin/spv*100) : 0;

let color = margin>=0 ? "green":"red";

// OUTPUT
document.getElementById("result").innerHTML = `
<b>--- RM Breakdown ---</b><br>
Polymer Cost: ${polymerCost.toFixed(2)}<br>
MB Cost: ${mbCost.toFixed(2)}<br>
Filler Cost: ${fillerCost.toFixed(2)}<br>
<b>Net RM Cost:</b> ${netRM.toFixed(2)}<br><br>

<b>--- Variable Cost ---</b><br>
Energy: ${energy.toFixed(2)}<br>
Labour: ${labour}<br>
Packaging: ${pack}<br>
Other: ${otherC}<br>
Wastage: ${wastv}<br>
<b>Total Variable:</b> ${variable.toFixed(2)}<br><br>

<b>Fixed Cost:</b> ${fixed}<br><br>

<b>--- Final ---</b><br>
Total Cost: ${totalCost.toFixed(2)}<br>
Selling Price: ${spv}<br>
Margin: <span class="${color}">${margin.toFixed(2)}</span><br>
Margin %: ${marginPct.toFixed(2)}%
`;

}

</script>

</body>
</html>
